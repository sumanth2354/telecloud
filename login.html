<!DOCTYPE html>
<html>

<head>
  <title>Login | Secure Cloud</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="center-screen">
    <div class="glass-container max-w-md fade-in">
      <div class="text-center mb-4">
        <div style="margin-bottom: 10px; color: var(--accent-color);">
          <span class="material-symbols-rounded" style="font-size: 3rem;">lock</span>
        </div>
        <h2 class="logo">Secure Login</h2>
        <p style="opacity: 0.7;">Authenticate via Telegram</p>
      </div>

      <!-- Step 1: Phone -->
      <div id="step1">
        <label style="display:block; margin-bottom:8px; font-weight:600;">
          <span class="material-symbols-rounded" style="font-size:1.2em; vertical-align:bottom;">smartphone</span> Phone
          Number
        </label>
        <div style="margin-bottom: 20px;">
          <input type="text" id="phone" value="+91" required>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="sendCode()">Send One-Time Password</button>
      </div>

      <!-- Step 2: OTP -->
      <div id="step2" style="display:none;">
        <label style="display:block; margin-bottom:8px; font-weight:600;">
          <span class="material-symbols-rounded" style="font-size:1.2em; vertical-align:bottom;">vpn_key</span> Enter
          OTP Code
        </label>
        <div style="margin-bottom: 20px;">
          <input type="text" id="otp" placeholder="e.g. 12345" required
            style="letter-spacing: 4px; text-align: center; font-size: 1.2rem;">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="verifyCode()">Verify & Login</button>
        <div class="text-center mt-4">
          <a href="#" onclick="location.reload()" style="font-size: 0.9rem;">Wrong number? Start over</a>
        </div>
      </div>

      <!-- Step 3: 2FA -->
      <div id="step3" style="display:none;">
        <label style="display:block; margin-bottom:8px; font-weight:600;">
          <span class="material-symbols-rounded" style="font-size:1.2em; vertical-align:bottom;">security</span>
          Two-Step Verification
        </label>
        <div style="margin-bottom: 20px;">
          <input type="password" id="password" placeholder="Enter your cloud password" required>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="verifyPassword()">Unlock Account</button>
      </div>

      <div id="status" class="status-msg" style="display:none;"></div>
    </div>
  </div>

  <script>
    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.innerText = msg;
      el.className = "status-msg " + (type === 'error' ? 'status-error' : 'status-success');
    }

    function sendCode() {
      const phone = document.getElementById("phone").value.trim();
      const btn = document.querySelector('#step1 button');

      if (!phone.startsWith("+")) {
        showStatus("Please include country code (e.g., +1)", "error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Sending...";

      fetch("/send_code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone })
      })
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          btn.innerText = "Send One-Time Password";

          if (data.status === "code_sent") {
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
            document.getElementById("step2").classList.add("fade-in");
            showStatus("✅ OTP sent to your Telegram app!", "success");
          } else {
            showStatus("❌ " + data.message, "error");
          }
        })
        .catch(() => {
          btn.disabled = false;
          showStatus("❌ Network error. Check connection.", "error");
        });
    }

    function verifyCode() {
      const phone = document.getElementById("phone").value.trim();
      const code = document.getElementById("otp").value.trim();

      fetch("/verify_code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone, code: code })
      })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            localStorage.setItem("telegram_phone", phone);
            showStatus("✅ Login successful! Redirecting...", "success");
            setTimeout(() => window.location.href = "/upload-page", 1000);
          } else if (data.status === "2fa_required") {
            document.getElementById("step2").style.display = "none";
            document.getElementById("step3").style.display = "block";
            document.getElementById("step3").classList.add("fade-in");
            showStatus("🔐 2FA Protected. Please enter password.", "success");
          } else {
            showStatus("❌ Invalid OTP or session expired.", "error");
          }
        })
        .catch((e) => showStatus("❌ Error: " + e, "error"));
    }

    function verifyPassword() {
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;

      fetch("/verify_password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone, password: password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            localStorage.setItem("telegram_phone", phone);
            showStatus("✅ Authenticated! Redirecting...", "success");
            setTimeout(() => window.location.href = "/upload-page", 1000);
          } else {
            showStatus("❌ Incorrect password.", "error");
          }
        });
    }
  </script>
</body>

</html>
