<!DOCTYPE html>
<html>

<head>
    <title>User Consent</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="center-screen">
        <div class="glass-container max-w-md fade-in">
            <h1 class="text-center logo">
                <span class="material-symbols-rounded"
                    style="font-size: 3rem; color: var(--accent-color);">security</span> Security Check
            </h1>

            <p style="margin-bottom: 25px; opacity: 0.8; line-height: 1.6;">
                Before accessing the secure cloud storage, please confirm your understanding of the following protocols:
            </p>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="consent1" required>
                <label for="consent1">I authorize phone number processing for Telegram OTP authentication.</label>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="consent2" required>
                <label for="consent2">I consent to temporary file buffering necessary for encryption/upload.</label>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="consent3" required>
                <label for="consent3">I understand session keys are encrypted locally on this server.</label>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="consent4" required>
                <label for="consent4">I accept the <a href="/privacy-policy" target="_blank">Privacy Policy</a> &
                    Terms.</label>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="consent5" required>
                <label for="consent5">I acknowledge this service bridges to Telegram and I use it at my own
                    risk.</label>
            </div>

            <div class="status-msg status-error" id="error-msg" style="display:none; align-items:center; gap:10px;">
                <span class="material-symbols-rounded">warning</span> Please accept all security protocols to proceed.
            </div>

            <div style="margin-top: 30px; display: flex; gap: 15px;">
                <button class="btn btn-primary" style="flex: 2;" onclick="acceptConsent()">Accept & Continue</button>
                <button class="btn btn-danger" style="flex: 1;" onclick="declineConsent()">Decline</button>
            </div>
        </div>
    </div>

    <script>
        function acceptConsent() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);

            if (!allChecked) {
                document.getElementById('error-msg').style.display = 'block';
                return;
            }

            localStorage.setItem('user_consent', 'true');
            localStorage.setItem('consent_date', new Date().toISOString());

            document.querySelector('.glass-container').style.opacity = '0';
            setTimeout(() => {
                window.location.href = '/login';
            }, 300);
        }

        function declineConsent() {
            if (confirm('Are you sure you want to decline? You will be redirected away.')) {
                window.location.href = 'https://google.com';
            }
        }

        if (localStorage.getItem('user_consent') === 'true') {
            window.location.href = '/login';
        }

        // Enter key to accept
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') acceptConsent();
        });
    </script>
</body>

</html>
