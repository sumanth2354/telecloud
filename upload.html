<!DOCTYPE html>
<html>
<head>
  <title>Telegram Folder Uploads</title>
  <meta charset="UTF-8" />
  <style>
    body {
      background: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .header {
      background: #e5e5e7;
      height: 60px;
      width: 100vw;
      margin-bottom: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
    }
    .logout-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .logout-btn:hover {
      background: #c82333;
    }
    .container {
      margin: 40px auto;
      max-width: 1100px;
      background: #777;
      border-radius: 0 0 10px 10px;
      padding: 40px 40px 60px 40px;
      min-height: 600px;
      box-sizing: border-box;
    }
    .folder-grid {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      margin-bottom: 40px;
      margin-left: 60px;
    }
    .folder-card {
      background: #e5e5e7;
      color: #222;
      width: 180px;
      height: 140px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border 0.2s;
      margin-bottom: 10px;
      flex-direction: column;
    }
    .folder-card.selected {
      border: 3px solid #1e90ff;
    }
    .folder-label {
      text-align: center;
      margin-top: 8px;
      color: #fff;
      font-size: 1.1em;
    }
    .create-folder-btn {
      background: #e5e5e7;
      color: #222;
      border: none;
      border-radius: 4px;
      padding: 18px 32px;
      font-size: 1.1em;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .create-folder-btn:hover {
      background: #d1d1d4;
    }
    .upload-section {
      margin: 30px 0 0 60px;
      max-width: 400px;
    }
    .upload-section label {
      color: #fff;
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    .upload-section input[type='file'] {
      margin-bottom: 16px;
      width: 100%;
    }
    .upload-section button {
      background: #1e90ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 10px;
    }
    .upload-section button:disabled {
      background: #888;
      cursor: not-allowed;
    }
    .file-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      margin-top: 40px;
      margin-left: 60px;
    }
    .file-card {
      background: #e5e5e7;
      color: #222;
      border-radius: 4px;
      width: 180px;
      min-height: 180px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      box-shadow: 0 2px 8px #0002;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .file-card:hover {
      transform: scale(1.05);
    }
    .file-card img {
      max-width: 140px;
      max-height: 100px;
      border-radius: 4px;
      margin-bottom: 10px;
      background: #ccc;
      cursor: pointer;
    }
    .file-name {
      font-weight: bold;
      font-size: 1em;
      margin-bottom: 4px;
      text-align: center;
      word-break: break-all;
    }
    .file-meta {
      font-size: 0.9em;
      color: #444;
      text-align: center;
    }
    .status {
      margin: 20px 0 0 60px;
      font-weight: bold;
      color: #ffb300;
    }
    .no-files {
      margin: 40px 0 0 60px;
      color: #fff;
      font-style: italic;
    }
    
    /* Gallery Modal Styles */
    .gallery-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
    }
    .gallery-content {
      position: relative;
      margin: auto;
      padding: 20px;
      width: 90%;
      height: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .gallery-image {
      max-width: 100%;
      max-height: 80%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 15px 20px;
      cursor: pointer;
      font-size: 24px;
      border-radius: 50%;
      transition: background 0.3s;
    }
    .gallery-nav:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .gallery-prev {
      left: 20px;
    }
    .gallery-next {
      right: 20px;
    }
    .gallery-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      background: none;
      border: none;
    }
    .gallery-close:hover {
      color: #bbb;
    }
    .gallery-info {
      margin-top: 20px;
      text-align: center;
      color: white;
    }
    .gallery-counter {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .gallery-filename {
      font-size: 16px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Telegram Folder Uploads</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
  <div class="container">
    <div class="folder-grid" id="folderGrid">
      <button class="create-folder-btn" onclick="createFolder()">create folder</button>
      <!-- Folders will be inserted here -->
    </div>

    <div class="upload-section">
      <form id="uploadForm" enctype="multipart/form-data">
        <label>Upload files to selected folder:</label>
        <input type="file" name="file" id="fileInput" multiple required>
        <input type="hidden" name="phone" id="phoneInput">
        <input type="hidden" name="folderName" id="folderNameInput">
        <button type="submit" id="uploadBtn" disabled>Upload</button>
      </form>
    </div>

    <div class="status" id="status"></div>

    <div class="file-grid" id="fileGrid"></div>
    <div class="no-files" id="noFilesMsg" style="display:none;">No files in this folder yet.</div>
  </div>

  <!-- Gallery Modal -->
  <div id="galleryModal" class="gallery-modal">
    <div class="gallery-content">
      <button class="gallery-close" onclick="closeGallery()">&times;</button>
      <button class="gallery-nav gallery-prev" onclick="prevImage()">&#10094;</button>
      <button class="gallery-nav gallery-next" onclick="nextImage()">&#10095;</button>
      <img id="galleryImage" class="gallery-image" src="" alt="">
      <div class="gallery-info">
        <div class="gallery-counter" id="galleryCounter"></div>
        <div class="gallery-filename" id="galleryFilename"></div>
      </div>
    </div>
  </div>

  <script>
    let selectedFolder = null;
    let folders = [];
    let phone = localStorage.getItem("telegram_phone");
    let currentFiles = []; // Store current folder's files
    let currentImageIndex = 0; // Current image index in gallery

    document.getElementById("phoneInput").value = phone;

    // Load folders on page load
    window.onload = function() {
      loadFolders();
    };

    async function loadFolders() {
      document.getElementById("folderGrid").innerHTML = '<button class="create-folder-btn" onclick="createFolder()">create folder</button>';
      folders = [];
      selectedFolder = null;
      document.getElementById("uploadBtn").disabled = true;
      document.getElementById("fileGrid").innerHTML = '';
      document.getElementById("noFilesMsg").style.display = 'none';

      if (!phone) return;

      const res = await fetch("/list_folders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();
      if (data.status === "success") {
        folders = data.folders;
        folders.forEach(folder => addFolderCard(folder));
      }
    }

    function addFolderCard(folder) {
      const grid = document.getElementById("folderGrid");
      const card = document.createElement("div");
      card.className = "folder-card";
      card.innerHTML = `<span style="font-size:2.2em;">📁</span><div class="folder-label">${folder}</div>`;
      card.onclick = () => selectFolder(folder, card);
      grid.appendChild(card);
    }

    async function createFolder() {
      const folder = prompt("Enter folder name:");
      if (!folder) return;
      
      const res = await fetch("/create_folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, folder_name: folder })
      });
      
      const data = await res.json();
      if (data.status === "success") {
        folders.push(folder);
        addFolderCard(folder);
      } else {
        alert(data.message || "Failed to create folder");
      }
    }

    function selectFolder(folder, cardElem) {
      selectedFolder = folder;
      document.getElementById("folderNameInput").value = folder;
      document.querySelectorAll(".folder-card").forEach(card => card.classList.remove("selected"));
      cardElem.classList.add("selected");
      document.getElementById("uploadBtn").disabled = false;
      loadFilesInFolder(folder);
    }

    async function loadFilesInFolder(folder) {
      document.getElementById("fileGrid").innerHTML = '';
      document.getElementById("noFilesMsg").style.display = 'none';
      if (!phone || !folder) return;
      const res = await fetch("/list_files_in_folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, folder })
      });
      const data = await res.json();
      if (data.status === "success") {
        currentFiles = data.files; // Store all files for gallery
        if (data.files.length === 0) {
          document.getElementById("noFilesMsg").style.display = '';
        } else {
          data.files.forEach(file => addFileCard(file));
        }
      }
    }

    function addFileCard(file) {
      const grid = document.getElementById("fileGrid");
      const card = document.createElement("div");
      card.className = "file-card";
      let preview = '';
      const isImage = file.mime_type && file.mime_type.startsWith('image/');
      
      if (isImage) {
        preview = `<img src="/get_file/${phone}/${file.id}" alt="${file.name}" onclick="openGallery(${currentFiles.indexOf(file)})">`;
      } else {
        preview = `<span style="font-size:2em;">📎</span>`;
      }
      
      card.innerHTML = `
        ${preview}
        <div class="file-name">${file.name}</div>
        <div class="file-meta">${formatFileSize(file.size)}<br>${formatDate(file.date)}</div>
      `;
      grid.appendChild(card);
    }

    function formatFileSize(bytes) {
      if (!bytes) return '';
      const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleString();
    }

    document.getElementById("uploadForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      if (!selectedFolder) {
        showStatus("Please select a folder first.");
        return;
      }
      const formData = new FormData(this);
      formData.set("phone", phone);
      formData.set("folderName", selectedFolder);

      showStatus("Uploading...");
      const res = await fetch("/upload", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      if (data.status === "success") {
        showStatus("Upload successful!");
        setTimeout(() => {
          showStatus('');
          loadFilesInFolder(selectedFolder);
        }, 1000);
      } else {
        showStatus("Upload failed: " + data.message);
      }
    });

    function showStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    // Gallery Modal Functions
    function openGallery(index) {
      currentImageIndex = index;
      const galleryModal = document.getElementById('galleryModal');
      galleryModal.style.display = 'flex';
      showGalleryImage();
      
      // Add keyboard event listeners
      document.addEventListener('keydown', handleGalleryKeydown);
    }

    function closeGallery() {
      document.getElementById('galleryModal').style.display = 'none';
      // Remove keyboard event listeners
      document.removeEventListener('keydown', handleGalleryKeydown);
    }

    function handleGalleryKeydown(e) {
      switch(e.key) {
        case 'ArrowLeft':
          prevImage();
          break;
        case 'ArrowRight':
          nextImage();
          break;
        case 'Escape':
          closeGallery();
          break;
      }
    }

    function showGalleryImage() {
      const galleryImage = document.getElementById('galleryImage');
      const galleryCounter = document.getElementById('galleryCounter');
      const galleryFilename = document.getElementById('galleryFilename');

      if (currentFiles.length > 0) {
        const file = currentFiles[currentImageIndex];
        galleryImage.src = `/get_file/${phone}/${file.id}`;
        galleryFilename.innerText = file.name;
        galleryCounter.innerText = `${currentImageIndex + 1}/${currentFiles.length}`;
      }
    }

    function prevImage() {
      currentImageIndex = (currentImageIndex - 1 + currentFiles.length) % currentFiles.length;
      showGalleryImage();
    }

    function nextImage() {
      currentImageIndex = (currentImageIndex + 1) % currentFiles.length;
      showGalleryImage();
    }

    function logout() {
      localStorage.removeItem("telegram_phone");
      window.location.href = "/"; // Redirect to login page (root route)
    }
  </script>
</body>
</html>
