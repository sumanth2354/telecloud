<!DOCTYPE html>
<html>

<head>
  <title>Dashboard | Secure Cloud</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="header">
    <div class="logo">
      <span class="material-symbols-rounded" style="vertical-align:bottom; margin-right:5px;">rocket_launch</span>
      TeleCloud
    </div>
    <div style="display:flex; align-items:center; gap:15px;">
      <span id="userPhone" style="font-size:0.9rem; opacity:0.7;"></span>
      <button class="btn btn-danger"
        style="padding: 8px 16px; font-size:0.9rem; display:flex; align-items:center; gap:5px;" onclick="logout()">
        <span class="material-symbols-rounded" style="font-size:1.2em;">logout</span> Logout
      </button>
    </div>
  </div>

  <div class="max-w-xl" style="padding: 40px 20px; flex:1;">

    <!-- Top Actions -->
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 30px;">
      <div>
        <h2 style="margin-bottom:5px;">Your Folders</h2>
        <p style="opacity:0.6;">Select a folder to view or upload files</p>
      </div>
      <button class="btn btn-primary" onclick="createFolder()">+ New Folder</button>
    </div>

    <div class="grid" id="folderGrid">
      <!-- Folders injected here -->
    </div>

    <!-- Upload Area -->
    <div class="glass-container fade-in" id="uploadSection" style="margin-top:40px; display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 style="margin:0; display:flex; align-items:center; gap:10px;">
          <span class="material-symbols-rounded">folder_open</span>
          <span id="currentFolderName">Select Folder</span>
        </h3>
        <span class="status-msg" id="uploadStatus" style="display:none; margin:0; padding: 5px 10px;"></span>
      </div>

      <form id="uploadForm" style="display:flex; gap:15px; align-items:center;">
        <input type="file" name="file" id="fileInput" multiple required style="flex:1;">
        <input type="hidden" name="phone" id="phoneInput">
        <input type="hidden" name="folderName" id="folderNameInput">
        <button type="submit" class="btn btn-primary" id="uploadBtn">Upload Files</button>
      </form>
    </div>

    <!-- Files Area -->
    <div id="fileSection" style="margin-top: 40px; display: none;">
      <h3 style="border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 20px;">Files</h3>
      <div class="grid" id="fileGrid"></div>
      <div id="noFilesMsg" class="text-center" style="padding: 40px; opacity: 0.5;">No files found in this folder.</div>
    </div>

  </div>

  <!-- Gallery Modal -->
  <div id="galleryModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center; flex-direction:column;">
    <button onclick="closeGallery()"
      style="position:absolute; top:20px; right:30px; background:none; border:none; color:white; font-size:40px; cursor:pointer;">&times;</button>

    <div style="position:relative; width:90%; height:80%; display:flex; align-items:center; justify-content:center;">
      <button onclick="prevImage()"
        style="position:absolute; left:0; background:rgba(255,255,255,0.1); border:none; color:white; padding:20px; font-size:24px; cursor:pointer; border-radius:50%; display:flex; align-items:center; justify-content:center;">
        <span class="material-symbols-rounded">chevron_left</span>
      </button>
      <img id="galleryImage"
        style="max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 0 50px rgba(0,0,0,0.5);">
      <button onclick="nextImage()"
        style="position:absolute; right:0; background:rgba(255,255,255,0.1); border:none; color:white; padding:20px; font-size:24px; cursor:pointer; border-radius:50%; display:flex; align-items:center; justify-content:center;">
        <span class="material-symbols-rounded">chevron_right</span>
      </button>
    </div>
    <div id="galleryCounter" style="margin-top:20px; color:white; font-size:1.1rem;"></div>
  </div>

  <script>
    let selectedFolder = null;
    let folders = [];
    let phone = localStorage.getItem("telegram_phone");
    let currentFiles = [];
    let currentImageIndex = 0;

    if (!phone) window.location.href = '/login';
    document.getElementById("userPhone").innerText = phone;
    document.getElementById("phoneInput").value = phone;

    window.onload = loadFolders;

    async function loadFolders() {
      const res = await fetch("/list_folders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();
      const grid = document.getElementById("folderGrid");
      grid.innerHTML = '';

      if (data.status === "success") {
        folders = data.folders;
        if (folders.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; opacity:0.6;">No folders yet. Create one to start!</div>';
        }
        folders.forEach(folder => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
                <div class="card-icon"><span class="material-symbols-rounded" style="font-size:3rem;">folder</span></div>
                <div class="card-title">${folder}</div>
            `;
          card.onclick = () => selectFolder(folder, card);
          grid.appendChild(card);
        });
      }
    }

    async function createFolder() {
      const folder = prompt("New Folder Name:");
      if (!folder) return;

      const res = await fetch("/create_folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, folder_name: folder })
      });

      const data = await res.json();
      if (data.status === "success") {
        loadFolders();
      } else {
        alert(data.message);
      }
    }

    function selectFolder(folder, cardElem) {
      selectedFolder = folder;
      document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
      cardElem.classList.add("selected");

      document.getElementById("uploadSection").style.display = "block";
      document.getElementById("uploadSection").classList.add("fade-in");
      document.getElementById("currentFolderName").innerText = folder;
      document.getElementById("folderNameInput").value = folder;

      loadFilesInFolder(folder);
    }

    async function loadFilesInFolder(folder) {
      document.getElementById("fileSection").style.display = "block";
      const grid = document.getElementById("fileGrid");
      grid.innerHTML = '<div class="text-center" style="width:100%">Loading files...</div>';

      const res = await fetch("/list_files_in_folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, folder })
      });
      const data = await res.json();
      grid.innerHTML = '';

      if (data.status === "success") {
        currentFiles = data.files;
        if (currentFiles.length === 0) {
          document.getElementById("noFilesMsg").style.display = "block";
        } else {
          document.getElementById("noFilesMsg").style.display = "none";
          currentFiles.forEach((file, idx) => {
            const isImage = file.mime_type && file.mime_type.startsWith('image/');
            const card = document.createElement("div");
            card.className = "card";

            let icon = '<span class="material-symbols-rounded" style="font-size:3rem;">description</span>';
            if (file.mime_type.includes('pdf')) icon = '<span class="material-symbols-rounded" style="font-size:3rem;">picture_as_pdf</span>';
            if (file.mime_type.includes('video')) icon = '<span class="material-symbols-rounded" style="font-size:3rem;">movie</span>';
            if (file.mime_type.includes('audio')) icon = '<span class="material-symbols-rounded" style="font-size:3rem;">music_note</span>';

            let previewHtml = `<div class="card-icon">${icon}</div>`;

            if (isImage) {
              previewHtml = `<img src="/get_file/${phone}/${file.id}" style="width:100%; height:120px; object-fit:cover; border-radius:8px; margin-bottom:10px;" onclick="openGallery(${idx})">`;
            }

            card.innerHTML = `
                ${previewHtml}
                <div class="card-title" style="font-size:0.9rem;">${file.name}</div>
                <div class="card-meta">${formatFileSize(file.size)}</div>
            `;
            if (!isImage) {
              // Make non-images downloadable or just visually distinct? 
              // For now, allow click to download if we added that route, but simple view assumes preview.
              card.onclick = () => window.open(`/get_file/${phone}/${file.id}`);
            }
            grid.appendChild(card);
          });
        }
      }
    }

    document.getElementById("uploadForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = document.getElementById("uploadBtn");
      const status = document.getElementById("uploadStatus");

      btn.disabled = true;
      btn.innerText = "Uploading...";
      status.style.display = "none";

      try {
        const formData = new FormData(this);
        const res = await fetch("/upload", { method: "POST", body: formData });
        const data = await res.json();

        if (data.status === "success") {
          status.innerText = "✅ Upload Complete";
          status.className = "status-msg status-success";
          status.style.display = "block";
          document.getElementById("fileInput").value = "";
          loadFilesInFolder(selectedFolder);
        } else {
          status.innerText = "❌ " + data.message;
          status.className = "status-msg status-error";
          status.style.display = "block";
        }
      } catch (err) {
        status.innerText = "❌ Network Error";
        status.className = "status-msg status-error";
        status.style.display = "block";
      }

      btn.disabled = false;
      btn.innerText = "Upload Files";
    });

    function formatFileSize(bytes) {
      if (!bytes) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function logout() {
      localStorage.removeItem("telegram_phone");
      window.location.href = "/";
    }

    // Gallery
    function openGallery(index) {
      currentImageIndex = index;
      document.getElementById("galleryModal").style.display = "flex";
      updateGallery();
    }
    function updateGallery() {
      const file = currentFiles[currentImageIndex];
      document.getElementById("galleryImage").src = `/get_file/${phone}/${file.id}`;
      document.getElementById("galleryCounter").innerText = `${currentImageIndex + 1} / ${currentFiles.length}`;
    }
    function closeGallery() { document.getElementById("galleryModal").style.display = "none"; }

    // Global Keyboard listener
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeGallery();
      }
      if (document.getElementById("galleryModal").style.display === "flex") {
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
      }
    });

    function prevImage() {
      // Find previous image index
      let newIndex = currentImageIndex;
      do {
        newIndex = (newIndex - 1 + currentFiles.length) % currentFiles.length;
      } while (!currentFiles[newIndex].mime_type.startsWith('image/') && newIndex !== currentImageIndex);

      currentImageIndex = newIndex;
      updateGallery();
    }

    function nextImage() {
      let newIndex = currentImageIndex;
      do {
        newIndex = (newIndex + 1) % currentFiles.length;
      } while (!currentFiles[newIndex].mime_type.startsWith('image/') && newIndex !== currentImageIndex);

      currentImageIndex = newIndex;
      updateGallery();
    }
  </script>
</body>

</html>
